name: LensFlow CI/CD 自动化流水线 (手动触发)

on:
  # 仅支持在 GitHub Actions 页面手动点击 "Run workflow" 按钮触发
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    name: 质检、构建与宝塔部署
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      # ==================== 后端检查与单元测试 ====================
      - name: 2. 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. 后端代码检查与单元测试
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite://
          QWEN_API_KEY: "test-mock-key"
          CELERY_TASK_ALWAYS_EAGER: "true"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m ruff check .
          python -m pytest -q

      # ==================== 前端检查与云端编译 ====================
      - name: 4. 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 5. 安装 Node.js 20 (带缓存)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 6. 安装前端依赖与类型检查
        run: |
          pnpm approve-builds --all || true
          pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
          pnpm typecheck

      - name: 7. 云端编译前端 (不占用宝塔内存)
        run: pnpm build

      # ==================== 自动化部署至宝塔服务器 ====================
      - name: 8. 打包轻量发布包
        run: |
          tar --warning=no-file-changed -czf /tmp/release.tar.gz \
            --exclude='release.tar.gz*' \
            --exclude='node_modules' \
            --exclude='apps/api/.venv' \
            --exclude='apps/web/.next-dev' \
            --exclude='.git' \
            --exclude='*.db' \
            --exclude='apps/api/uploads/*' \
            --exclude='*.log' \
            --exclude='__pycache__' \
            .
          mv /tmp/release.tar.gz ./release.tar.gz

      - name: 9. 上传发布包至宝塔服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "release.tar.gz"
          target: "/tmp"

      - name: 10. 宝塔端解压并平滑重启 PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.SERVER_DEPLOY_DIR || '/www/wwwroot/lensflow' }}"

            echo "🚀 [1/3] 解压新版本到站点目录: $DEPLOY_DIR"
            mkdir -p "$DEPLOY_DIR"
            tar -xzf /tmp/release.tar.gz -C "$DEPLOY_DIR"
            rm -f /tmp/release.tar.gz

            cd "$DEPLOY_DIR"

            echo "📦 [2/3] 检查更新 Python 依赖..."
            if [ -d "apps/api/.venv" ]; then
              apps/api/.venv/bin/pip install -e 'apps/api[dev]' --quiet || true
            fi

            echo "🔄 [3/3] 平滑重载或拉起 PM2 服务..."
            pm2 restart ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save

            echo "✅ Lensflow 自动部署成功！"
