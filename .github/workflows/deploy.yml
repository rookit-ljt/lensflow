name: 自动构建并部署至宝塔服务器

on:
  push:
    branches: [main, master] # 当推送到 main 或 master 分支时自动触发
  workflow_dispatch:        # 支持在 GitHub 网页上手动点击按钮触发

concurrency:
  group: deploy-to-bt
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: 云端构建并同步至宝塔
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 3. 安装 Node.js 20 (带缓存)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 4. 云端编译前端与依赖 (不占用宝塔服务器资源)
        run: |
          pnpm approve-builds --all || true
          pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile
          pnpm build

      - name: 5. 打包构建产物与源码 (轻量化，排除大文件与本地缓存)
        run: |
          tar -czf release.tar.gz \
            --exclude='node_modules' \
            --exclude='apps/api/.venv' \
            --exclude='apps/web/.next-dev' \
            --exclude='.git' \
            --exclude='*.db' \
            --exclude='apps/api/uploads/*' \
            --exclude='*.log' \
            --exclude='__pycache__' \
            .

      - name: 6. 上传部署包至宝塔服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "release.tar.gz"
          target: "/tmp"

      - name: 7. 宝塔服务器端解压并平滑重启服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.SERVER_DEPLOY_DIR || '/www/wwwroot/lensflow' }}"

            echo "🚀 [1/3] 解压新版本到站点目录: $DEPLOY_DIR"
            mkdir -p "$DEPLOY_DIR"
            tar -xzf /tmp/release.tar.gz -C "$DEPLOY_DIR"
            rm -f /tmp/release.tar.gz

            cd "$DEPLOY_DIR"

            echo "📦 [2/3] 检查更新 Python 依赖..."
            if [ -d "apps/api/.venv" ]; then
              apps/api/.venv/bin/pip install -e 'apps/api[dev]' --quiet || true
            fi

            echo "🔄 [3/3] 平滑重载或拉起 PM2 服务..."
            pm2 restart ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save

            echo "✅ Lensflow 自动部署成功！"
