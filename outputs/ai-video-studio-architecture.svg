<svg width="680" viewBox="0 0 680 884" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
<title>AI Video Studio Web Platform 分层架构</title>
<desc>自浏览器表现层向下依次为共享协议层、FastAPI 应用层、Agent 子系统、Celery 任务执行层、模型 Provider 适配层，以及数据存储与外部模型服务。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
