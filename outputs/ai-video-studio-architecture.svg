</marker>
</defs>
<rect x="0" y="0" width="680" height="884" fill="#FFFFFF"/>
<text x="40" y="52" font-size="15" font-weight="500" fill="#0C447C">AI Video Studio Web Platform · 分层架构</text>
<text x="40" y="70" font-size="12" fill="#5F5E5A">pnpm monorepo：apps/web + apps/api + packages/workflow-schema</text>

